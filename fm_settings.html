<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | STACKLY</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}

body{
background:linear-gradient(135deg,#080808,#0b0b0b,#090909);
color:#222;
overflow-x:hidden;
min-height:100vh;
}

/* HEADER */
header{
position:fixed;
top:0;
width:100%;
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
background:#111111;
box-shadow:0 4px 15px rgba(0,0,0,.06);
z-index:3000;
}

.header-left{display:flex;align-items:center;}
.logo img {
    height: 65px;
}

/* Mobile logo size */
@media (max-width: 768px) {
    .logo img {
        height: 35px;
        width: auto;
    }
}

.profile{display:flex;gap:15px;align-items:center;}
.profile i{color:#222;}

/* SIDEBAR */
.sidebar{
width:250px;
background:#111111;
border-right:1px solid rgba(255,255,255,.08);
position:fixed;
top:70px;
height:calc(100% - 70px);
padding:20px;
display:flex;
flex-direction:column;
z-index:2500;
transition:0.3s;
}

.sidebar a{
display:flex;
gap:12px;
padding:12px;
border-radius:10px;
color:#a4a4ad;
text-decoration:none;
margin-bottom:5px;
align-items:center;
transition:0.2s;
}

.sidebar a:hover{
background:#0a0a0a;
color:#c7954a;
}

.sidebar a.active{
background:#c7954a;
color:#fff;
}

/* MAIN */
.main{
margin-left:250px;
padding:100px 30px;
}

/* PANEL */
.panel{
background:#111111;
padding:25px;
border-radius:15px;
margin-bottom:25px;
box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.panel h3{
margin-bottom:15px;
}

/* INPUT */
.input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

/* BUTTON */
.btn{
background:#c7954a;
border:none;
padding:12px 20px;
border-radius:8px;
color:#fff;
margin-top:10px;
cursor:pointer;
font-weight:600;
}

/* HAMBURGER */
.hamburger{
display:none;
font-size:24px;
cursor:pointer;
color:#c7954a;
margin-right:15px;
}

/* MOBILE */
@media(max-width:768px){

.hamburger{display:flex;}

.sidebar{
transform:translateX(-100%);
top:70px;
height:calc(100% - 70px);
width:280px;
}

.sidebar.active{
transform:translateX(0);
}

.main{
margin-left:0;
padding:90px 20px;
}

.overlay{
top:70px;
height:calc(100% - 70px);
position:fixed;
left:0;
width:100%;
background:rgba(0,0,0,0.3);
opacity:0;
visibility:hidden;
transition:0.3s;
z-index:2000;
}

.overlay.active{
opacity:1;
visibility:visible;
}
}

/* PREMIUM INSURANCE SETTINGS HOVERS */

.btn{
    transition:all .3s ease;
}

.btn:hover{
    background:#c7954a;
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(199,149,74,.30);
}

.panel{
    transition:all .3s ease;
}

.panel:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 45px rgba(167,15,249,.12);
}

.input{
    transition:all .3s ease;
}

.input:focus{
    border-color:#c7954a;
    box-shadow:0 0 0 4px rgba(167,15,249,.12);
}

.fa-bell,
.fa-client{
    transition:all .3s ease;
}

.fa-bell:hover,
.fa-client:hover{
    transform:scale(1.1);
    color:#c7954a;
}

.sidebar a{
    transition:all .3s ease;
}

.sidebar .logout{
    color:#c7954a;
    border:1px solid rgba(199,149,74,0.10);
    background:rgba(199,149,74,0.03);
    margin-top:10px;
    cursor:pointer;
    padding:12px;
    border-radius:10px;
    display:flex;
    gap:12px;
    align-items:center;
    text-decoration:none;
    transition:all .3s ease;
}

.sidebar .logout:hover{
    background:rgba(199,149,74,0.12);
    color:#c7954a;
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(199,149,74,.25);
}

@media (max-width: 768px) {
    .mobile-hide {
        display: none !important;
    }
}

@media (max-width:768px){

    #profileName{
        font-size:14px;
        font-weight:600;
    }

    #profileEmail{
        font-size:10px;
        color:#9b9ba3;
        max-width:130px;
        overflow-wrap:anywhere;
    }

}

    position:fixed;
    top:0;
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#111111;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    border-bottom:1px solid rgba(255,255,255,0.08);
    z-index:3000;
}

    display:flex;
    align-items:center;
}

    height: 65px;
}

@media (max-width: 768px) {
    .logo img {
        height: 35px;
        width: auto;
    }
}

.profile{
    display:flex;
    gap:15px;
    align-items:center;
}

.profile i{
    color:#222;
}

        display:flex;
    }

    .sidebar{
        transform:translateX(-100%);
        background:#111111;

        transform:translateX(0);

    }

    .overlay.active{
        opacity:1;
        visibility:visible;
    }
}

    #profileName{

    }

    #profileEmail{
        font-size:10px;
        color:#9b9ba3;
        max-width:130px;
        overflow-wrap:anywhere;
    }
}

@media (max-width:768px){

    .profile-info{
        display:flex !important;
        flex-direction:column;
        line-height:1.2;
        max-width:120px;
    }

    .profile-name{
        display:block !important;
        font-size:12px;
        font-weight:600;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .profile-email{
        display:block !important;
        font-size:10px;
        color:#9b9ba3;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

}                                                                    

</style>

<style id="luxury-dark-theme">
html,body{background:#080808!important;color:#f5f5f5!important;}
header{background:#111111!important;border-bottom:1px solid rgba(255,255,255,.08)!important;box-shadow:0 8px 30px rgba(0,0,0,.28)!important;}
.sidebar{background:#111111!important;border-right:1px solid rgba(255,255,255,.08)!important;}
.sidebar a{color:#9b9ba3!important;}
.sidebar a:hover{background:#0a0a0a!important;color:#c7954a!important;transform:translateX(3px);}
.sidebar a.active{background:#c7954a!important;color:#fff!important;}
.panel{background:#111111!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 18px 50px rgba(0,0,0,.28)!important;transition:all .3s ease!important;}
.panel:hover{transform:translateY(-4px)!important;border-color:#c7954a!important;box-shadow:0 20px 45px rgba(199,149,74,.18)!important;}
.input{background:#0a0a0a!important;color:#f5f5f5!important;border:1px solid rgba(255,255,255,.12)!important;}
.input::placeholder{color:#9b9ba3!important;}
.input:focus{border-color:#c7954a!important;box-shadow:0 0 0 4px rgba(199,149,74,.12)!important;}
.btn{background:#c7954a!important;color:#fff!important;transition:all .3s ease!important;}
.btn:hover{background:#c7954a!important;transform:translateY(-4px)!important;box-shadow:0 12px 25px rgba(199,149,74,.30)!important;}
.profile i{color:#f5f5f5!important;}
.profile i:hover,.fa-bell:hover,.fa-client:hover{color:#c7954a!important;transform:scale(1.1);}
.hamburger{color:#c7954a!important;}
.sidebar .logout{color:#c7954a!important;border-color:rgba(199,149,74,.10)!important;background:rgba(199,149,74,.03)!important;}
.sidebar .logout:hover{background:rgba(199,149,74,.12)!important;color:#c7954a!important;transform:translateY(-3px);box-shadow:0 12px 25px rgba(199,149,74,.25);}
.panel h3{color:#f5f5f5!important;}
.panel p{color:#d8d8dc!important;}
.overlay{background:rgba(0,0,0,.8)!important;}
@media(max-width:768px){.sidebar{background:#111111!important;}}
</style>

<style>
@media (hover: none), (pointer: coarse){
    .sidebar a:hover,
    .sidebar a.logout:hover,
    .card:hover,
    .add-btn:hover,
    .action-btn:hover,
    .bell:hover,
    .fa-client:hover{
        transform:none !important;
        box-shadow:none !important;
    }
}
</style>

</head>

<body>

<header>
    <div class="header-left">
        <div class="hamburger" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="logo">
            <img src="assets/images/logo/stackly_logo.webp" alt="Stackly">
        </div>
    </div>

    <div class="profile">
        <i class="fa-regular fa-bell mobile-hide" onclick="go404()" style="cursor:pointer;font-size:18px;"></i>

        <i class="fa-regular fa-client mobile-hide"
           onclick="go404()"
           style="font-size:22px;cursor:pointer;"></i>

        <div>
            <div id="profileName" style="font-weight:600;font-size:14px;">Client</div>
            <div id="profileEmail" style="font-size:11px;color:#9b9ba3;">client@mail.com</div>
        </div>
    </div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-content">
<a href="fm_dashboard.html">
<i class="fa-solid fa-house"></i>
<span>Dashboard</span>
</a>

<a href="watchlist.html">
<i class="fa-solid fa-briefcase"></i>
<span>My Legal Cases</span>
</a>

<a href="my_ratings.html">
<i class="fa-solid fa-star"></i>
<span>My Reviews</span>
</a>

<a href="fm_settings.html" class="active">
<i class="fa-solid fa-gear"></i>
<span>Settings</span>
</a>
    </div>

    <a onclick="logoutClient()" class="logout">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
    </a>
</aside>

<main class="main">

<h1 style="margin-bottom:25px;font-weight:800;">Settings ⚙️</h1>

<!-- PROFILE -->
<div class="panel">
<h3>Profile Settings</h3>

<input class="input" placeholder="Full Name">
<input class="input" placeholder="Email Address">

<button class="btn" onclick="go404()">Update Profile</button>
</div>

<!-- PASSWORD -->
<div class="panel">
<h3>Password</h3>

<input class="input" type="password" placeholder="New Password">

<button class="btn" onclick="go404()">Change Password</button>
</div>

<!-- PREFERENCES -->
<div class="panel">
<h3>Preferences</h3>

<p>Theme: Light Mode ☀️</p>
<p>Notifications: Enabled 🔔</p>

<button class="btn" onclick="go404()">Manage Preferences</button>
</div>

</main>

<script>
function toggleSidebar(){
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

sidebar.classList.toggle("active");
overlay.classList.toggle("active");
}

function go404(){ window.location.href="fm_404.html"; }

function logoutClient(){
localStorage.clear();
window.location.href="login.html";
}

const storedData = localStorage.getItem("clientData");
if(storedData){
const client = JSON.parse(storedData);
document.getElementById("profileName").textContent = client.role || "Client";
document.getElementById("profileEmail").textContent = client.email;
}
</script>

</body>
</html>
